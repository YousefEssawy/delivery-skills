name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate skills
        run: node scripts/validate-skills.mjs
      - name: Package skills
        run: node scripts/package-skills.mjs
      - name: Create the release if it does not exist
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; only uploading assets."
            exit 0
          fi
          # Notes = the CHANGELOG section whose heading starts with "## $TAG", up to the next "## ".
          awk -v tag="$TAG" '
            /^## / { inside = ($2 == tag) ; if (inside) next }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no '## $TAG' section; add one before tagging."
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
      - name: Attach the zips
        run: gh release upload "$TAG" dist/*.zip --clobber
