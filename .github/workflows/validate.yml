name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate skills
        run: node scripts/validate-skills.mjs
      - name: Validate evals
        run: node scripts/validate-evals.mjs
